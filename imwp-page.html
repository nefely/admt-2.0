<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ADMT IMWP PAGE</title>
</head>
<body id="imwp-page-body">

<script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async=""></script>
<script type="text/javascript">
window.getURLParameter = (sUrl, sParam) => {
    let sPageURL = decodeURI(sUrl.substring(sUrl.indexOf('?') + 1));
    let sURLVariables = sPageURL.split('&');
    for (let i = 0; i < sURLVariables.length; i++) {
        let sParameterName = sURLVariables[i].split('=');
        if (sParameterName[0] == sParam) {
            return sParameterName[1];
        }
    }
}

window.admt_conf = {
    key: getURLParameter(window.location.href , "admt_c_t"),

    subid: `{subid}`,
    landing_id: `{landing_id}`,
    campaign_id: `{campaign_id}`,
    stream_id: `{stream_id}`,

    vertical: "adult",
    sorc_id: "trxr",

    offer: `{offer}`
}
</script>
<script type="text/javascript">
var admt_script_el = document.createElement('script');

// test
admt_script_el.setAttribute('src',`admt_scripts.js?v=${Date.now()}`);
// prod
// admt_script_el.setAttribute('src',`https://cdn.adasty.com/a/admt_scripts.js?v=${Date.now()}`);

document.head.appendChild(admt_script_el);
</script>

</body>
</html>
